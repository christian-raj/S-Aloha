# Publication d'une version : à chaque tag vX.Y.Z, construit et pousse les images sur
# le registre GitHub (ghcr.io), étiquetées avec la version et « latest ».
# Aucune action tierce hormis checkout (épinglée par SHA, comme dans ci.yml).
name: Publication

on:
  push:
    tags: ['v*.*.*']

permissions:
  contents: read
  packages: write

jobs:
  images:
    name: Images ghcr.io
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Connexion au registre
        run: echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin
      - name: Construction et envoi
        env:
          VERSION: ${{ github.ref_name }}
          COMMIT: ${{ github.sha }}
        run: bash scripts/publier-images.sh "$VERSION" latest
