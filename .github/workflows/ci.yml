# Contrôles de chaque push sur main et de chaque pull request : tests de l'API
# (PostgreSQL réel via Testcontainers), tests et build de l'interface, santé
# de la documentation, build des deux images ; sur une pull request, signature
# DCO de chaque commit (ADR-0010).
# Actions épinglées par SHA (tenues à jour par Dependabot) ; jeton en lecture seule.
name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  api:
    name: API (.NET)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          # L'API cible net8.0, le projet de tests net10.0.
          dotnet-version: |
            8.0.x
            10.0.x
      - name: Tests
        run: dotnet test tests/SAloha.Api.Tests
        env:
          TESTCONTAINERS_RYUK_DISABLED: "true"
      - name: Dépendances vulnérables
        run: |
          dotnet list backend/SAloha.Api.csproj package --vulnerable --include-transitive | tee vuln.txt
          ! grep -q "has the following vulnerable packages" vuln.txt

  web:
    name: Interface (React)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npm run build
      - name: Dépendances vulnérables
        run: npm audit --audit-level=high

  docs:
    name: Documentation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: python3 scripts/check-docs.py

  images:
    name: Images Docker
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: docker build -t s-aloha-api backend
      - run: docker build -t s-aloha-web frontend

  dco:
    name: DCO
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha }}
      - name: Signed-off-by de l'auteur sur chaque commit
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          fail=0
          for c in $(git rev-list --no-merges "$BASE..$HEAD"); do
            email=$(git log -1 --format=%ae "$c")
            # Les bots (Dependabot) ne signent pas : ils ne cèdent aucun code d'auteur.
            case "$email" in *"[bot]@users.noreply.github.com") continue ;; esac
            if git log -1 --format=%B "$c" | git interpret-trailers --parse \
                 | grep -i "^signed-off-by:" | grep -qF "<$email>"; then
              echo "✔ $(git log -1 --format='%h %s' "$c")"
            else
              echo "::error::Commit $(git log -1 --format='%h « %s »' "$c") sans Signed-off-by pour <$email>"
              fail=1
            fi
          done
          if [ "$fail" = 1 ]; then
            echo "Signez vos commits : git commit -s (voir CONTRIBUTING.md § Certificat d'origine)."
            echo "Rattrapage : git rebase --signoff $BASE puis git push --force-with-lease."
          fi
          exit $fail
