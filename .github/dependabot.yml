# Mises à jour de version, regroupées et hebdomadaires. Les correctifs de
# sécurité, eux, arrivent dès l'alerte (Dependabot security updates).
# Les versions majeures sont ignorées : changer de React, de Vite, de .NET ou
# d'image de base est une décision (ADR-0004), pas une mise à jour de routine.
version: 2
updates:
  - package-ecosystem: npm
    directory: /frontend
    schedule: { interval: weekly, day: monday }
    groups:
      frontend:
        update-types: [minor, patch]
    labels: [dependencies]
    ignore:
      - dependency-name: "*"
        update-types: [version-update:semver-major]

  - package-ecosystem: nuget
    directories: [/backend, /tests/SAloha.Api.Tests]
    schedule: { interval: weekly, day: monday }
    groups:
      dotnet:
        update-types: [minor, patch]
    labels: [dependencies]
    ignore:
      - dependency-name: "*"
        update-types: [version-update:semver-major]

  - package-ecosystem: docker
    directories: [/backend, /frontend]
    schedule: { interval: weekly, day: monday }
    labels: [dependencies]
    ignore:
      - dependency-name: "*"
        update-types: [version-update:semver-major]

  - package-ecosystem: github-actions
    directory: /
    schedule: { interval: weekly, day: monday }
    groups:
      actions:
        patterns: ["*"]
    labels: [dependencies]
    ignore:
      - dependency-name: "*"
        update-types: [version-update:semver-major]
