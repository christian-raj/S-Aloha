# Schéma vu par le client : celui que transmet le proxy amont (Traefik, ingress), sinon celui
# de la connexion reçue — derrière un proxy TLS, nginx reçoit du HTTP.
map $http_x_forwarded_proto $client_scheme {
    default $http_x_forwarded_proto;
    ""      $scheme;
}

server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    # S5 (ADR-0018) : politique de sécurité du contenu. Scripts de la seule origine, plus le
    # script de thème en ligne d'index.html, autorisé par son empreinte (vérifiée par
    # src/security/csp.test.js) ; polices Google Fonts ; aucun cadre, aucun objet.
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'sha256-5vXrBhFSSxEKuW7c3zdE+srjuHjKj0bJYwtchW3/gKg='; style-src 'self' https://fonts.googleapis.com; font-src https://fonts.gstatic.com; img-src 'self' data:; connect-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "same-origin" always;

    location /api/ {
        proxy_pass http://api:8080;
        proxy_set_header Host $host;
        # HTTPS terminé en amont : l'API pose alors un cookie de session Secure.
        proxy_set_header X-Forwarded-Proto $client_scheme;
    }

    location / {
        try_files $uri /index.html;
    }
}
