# Schéma vu par le client : celui que transmet le proxy amont (Traefik, ingress), sinon celui
# de la connexion reçue — derrière un proxy TLS, nginx reçoit du HTTP.
map $http_x_forwarded_proto $client_scheme {
    default $http_x_forwarded_proto;
    ""      $scheme;
}

server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    # S5 (ADR-0018) : politique de sécurité du contenu. Scripts de la seule origine, plus le
    # script de thème en ligne d'index.html, autorisé par son empreinte (vérifiée par
    # src/security/csp.test.js) ; styles et polices de la seule origine (ADR-0021) ; aucun cadre, aucun objet.
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'sha256-nPhc2Gv3GuHYWx2NylnnNpQzHWpLSsmY5kvnL54aPlo='; style-src 'self'; font-src 'self'; img-src 'self' data:; connect-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "same-origin" always;

    # SOC-25 : pièces jointes, jusqu'à 100 Mo (taille maximale réglable dans la console, ADM-61).
    location /api/attachments {
        client_max_body_size 101m;
        proxy_pass http://api:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $client_scheme;
    }

    location /api/ {
        # Imports de fichiers : registre OUI de l'IEEE (≈ 4 Mo en JSON, 12 Mo admis par l'API),
        # texte du référentiel NIS 2 (5 Mo). Le défaut de nginx (1 Mo) les refusait en 413.
        client_max_body_size 16m;
        proxy_pass http://api:8080;
        proxy_set_header Host $host;
        # HTTPS terminé en amont : l'API pose alors un cookie de session Secure.
        proxy_set_header X-Forwarded-Proto $client_scheme;
    }

    location / {
        try_files $uri /index.html;
    }
}
