<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="S-Aloha — intégration des processus ITIL." />
  <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
  <meta name="theme-color" content="#070d1a" />
  <title>S-Aloha</title>
  <script>
    // Thème posé AVANT le premier rendu : décidé dans React, il ferait
    // flasher l'écran au chargement. Sombre par défaut (ADR-0021), sauf choix
    // explicite du mode clair, mémorisé par la bascule.
    (function () {
      var t = null
      try { t = localStorage.getItem('s-aloha-theme') } catch (e) {}
      if (t !== 'light') document.documentElement.classList.add('dark')
    })()
  </script>
</head>
<body>
  <div id="root"></div>
  <script type="module" src="/src/main.jsx"></script>
</body>
</html>
