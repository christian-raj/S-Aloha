<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="S-Aloha — intégration des processus ITIL : l'excellence du service IT au cœur de notre performance." />
  <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Jost:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
  <title>S-Aloha</title>
  <script>
    // Thème posé AVANT le premier rendu : décidé dans React, il ferait
    // flasher l'écran en clair au chargement d'une session sombre.
    (function () {
      var t = null
      try { t = localStorage.getItem('s-aloha-theme') } catch (e) {}
      if (t === 'dark' || (!t && window.matchMedia('(prefers-color-scheme: dark)').matches))
        document.documentElement.classList.add('dark')
    })()
  </script>
</head>
<body>
  <div id="root"></div>
  <script type="module" src="/src/main.jsx"></script>
</body>
</html>
