name: s-aloha

services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: saloha
      POSTGRES_USER: saloha
      POSTGRES_PASSWORD: ChangeMe_Str0ng!
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U saloha"]
      interval: 5s
      retries: 10

  api:
    # Image publiée à chaque version ; « up --build » construit depuis les sources.
    image: ghcr.io/chrraj7/s-aloha-api:${S_ALOHA_VERSION:-latest}
    build: ./backend
    depends_on:
      db:
        condition: service_healthy
    environment:
      ConnectionStrings__Default: "Host=db;Database=saloha;Username=saloha;Password=ChangeMe_Str0ng!"
      # --- Active Directory on-prem : à adapter ---
      Ldap__Host: "dc01.mondomaine.local"
      Ldap__Port: "389"
      Ldap__UseSsl: "false"
      Ldap__BaseDn: "DC=mondomaine,DC=local"
      Ldap__BindUser: "CN=svc-saloha,OU=Services,DC=mondomaine,DC=local"
      Ldap__BindPassword: "MotDePasseServiceAccount"
      Ldap__UserFilter: "(&(objectClass=user)(sAMAccountName={0}))"
      # --- Mapping groupes AD -> rôles applicatifs ---
      Ldap__Groups__Admin: "GRP-SALOHA-ADMINS"
      Ldap__Groups__Manager: "GRP-SALOHA-MANAGERS"
      Ldap__Groups__User: "GRP-SALOHA-USERS"
      Jwt__Key: "CHANGEZ-CETTE-CLE-SECRETE-DE-64-CARACTERES-MINIMUM-0123456789ab"
      # --- Découverte automatique (CFG-45) : clé du coffre d'identifiants, hors de la base ---
      # À changer avant le premier identifiant enregistré : la changer ensuite rend les secrets illisibles.
      Discovery__VaultKey: "CHANGEZ-CETTE-CLE-DU-COFFRE-DE-32-CARACTERES-MINIMUM-0123456789"
      # --- Recherche hybride (ADR-0013) : service d'embeddings ci-dessous ---
      # Vide : recherche par les mots seulement. L'API n'attend pas ce service.
      Embeddings__Url: "http://embeddings:11434"
      Embeddings__Model: "bge-m3"
    ports:
      - "8080:8080"

  embeddings:
    # Embeddings bge-m3 servis par Ollama, hors du processus de l'API (ADR-0013).
    # Premier démarrage : téléchargement du modèle (~1,2 Go), gardé dans le volume.
    image: ollama/ollama:0.40.1
    entrypoint: ["/bin/sh", "-c", "ollama serve & until ollama list >/dev/null 2>&1; do sleep 1; done; ollama pull bge-m3 && wait"]
    volumes:
      - ollama:/root/.ollama
    # bge-m3 occupe ~1,2 Go une fois chargé ; marge pour les pics de calcul.
    mem_limit: 3g

  garage:
    # Pièces jointes (SOC-25, ADR-0020) : stockage compatible S3, démarré seulement avec le
    # profil « pieces-jointes ». Réglage dans Administration › Messagerie et stockage :
    # adresse http://garage:3900, région garage (docs/reference/exploitation.md).
    image: dxflrs/garage:v2.1.0
    profiles: ["pieces-jointes"]
    environment:
      # Obligatoire avec le profil (sinon Garage refuse de démarrer) : openssl rand -hex 32.
      GARAGE_RPC_SECRET: ${GARAGE_RPC_SECRET:-}
    volumes:
      - ./garage/garage.toml:/etc/garage.toml:ro
      - garage-meta:/var/lib/garage/meta
      - garage-data:/var/lib/garage/data

  web:
    image: ghcr.io/chrraj7/s-aloha-web:${S_ALOHA_VERSION:-latest}
    build: ./frontend
    depends_on:
      - api
    ports:
      - "80:80"

volumes:
  pgdata:
  ollama:
  garage-meta:
  garage-data:
